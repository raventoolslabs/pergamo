# Pergamo: aplicacion, worker de indexacion y cola.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# El .env y el directorio ./data que montan los servicios se buscan junto a este
# fichero, dentro de docker/; el contexto de construccion es la raiz.
#
# Dos dependencias externas que este fichero NO declara:
#
# * PostgreSQL: el destino sale del .env (DB_HOST, DB_PORT) y se alcanza por la
#   red 'db', donde vive el postgres compartido del host.
# * ClamAV: el clamav-daemon del host, por su socket unix. La aplicacion usa su
#   defecto, /run/clamav/clamd.ctl, sin declarar nada en el .env. Ver la
#   seccion ClamAV del README.
#
# La red es EXTERNA: no la crea este fichero. Si no existe todavia:
#
#   docker network create db

# Sin esto el proyecto tomaria el nombre del directorio ('docker'), y con el se
# renombrarian la imagen y el volumen de firmas.
name: "pergamo"

# Se monta el DIRECTORIO y no el socket: clamd lo recrea en cada reinicio, y un
# montaje del fichero se quedaria apuntando al inodo viejo.
x-clamav-socket: &clamav-socket "/run/clamav:/run/clamav:ro"

services:

  # Solo para hosts donde no se puede instalar clamav-daemon. Se activa con
  # `--profile clamav` y CLAMAV_HOST=clamav en el .env, que cambia la aplicacion
  # de socket a TCP.
  clamav:
    profiles: ["clamav"]
    container_name: "pergamo-clamav"
    # Version fijada: el motor y el formato de la base de firmas van
    # emparejados, y un salto de version no anunciado puede dejar a clamd sin
    # cargar las firmas.
    image: "clamav/clamav:1.4.4"
    restart: "always"
    # El fichero de firmas ignoradas se COPIA al directorio de bases en el
    # arranque, en lugar de montarse dentro de el. El entrypoint de la imagen
    # oficial hace un `chown -R clamav:clamav /var/lib/clamav` bajo `set -e`, y
    # un montaje de solo lectura ahi dentro lo hace fallar antes de arrancar
    # clamd: el contenedor queda en bucle de reinicio con
    # «chown: /var/lib/clamav/local.ign2: Read-only file system».
    entrypoint: ["/bin/sh", "-c", "cp /etc/clamav/local.ign2 /var/lib/clamav/local.ign2 && exec /init"]
    volumes:
      # Las firmas persisten entre reinicios: sin esto, cada arranque vuelve a
      # descargar la base completa desde cero.
      - "clamav-data:/var/lib/clamav"
      - "./clamav/clamd.conf:/etc/clamav/clamd.conf:ro"
      - "./clamav/local.ign2:/etc/clamav/local.ign2:ro"
    # El puerto NO se publica al host: clamd no autentica, y solo la API
    # necesita alcanzarlo por la red interna.
    expose:
      - "3310"
    healthcheck:
      # PING/PONG por TCP: clamd no responde mientras carga las firmas.
      #
      # Se pregunta a 127.0.0.1 y no se usa clamdcheck.sh, el script de la
      # imagen oficial, porque ese consulta `nc localhost 3310` y dentro del
      # contenedor 'localhost' resuelve primero a ::1: con TCPAddr fijado a IPv4
      # el script falla siempre y el servicio quedaria eternamente 'unhealthy'.
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: "30s"
      timeout: "20s"
      retries: 10
      # La primera carga de firmas tarda; hasta agotarlo, un fallo no cuenta
      # como reintento ni marca el servicio como no sano.
      start_period: "180s"

  redis:
    container_name: "pergamo-redis"
    image: "redis:7-alpine"
    restart: "always"
    # Solo transporte de la cola: el estado de verdad vive en PostgreSQL, asi
    # que perder este volumen no pierde nada que no recupere `npm run reindex`.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: "10s"
      timeout: "5s"
      retries: 5

  pergamo:
    container_name: "pergamo"
    #image: "pergamo"
    restart: "always"
    # El contexto es la raiz del repositorio, no este directorio: alli viven el
    # Dockerfile y el codigo que copia.
    build:
      context: ".."
      dockerfile: "Dockerfile"
    # El 6231 es la puerta de entrada, la misma que usa `npm run dev` para la
    # interfaz de Vite. Los dos entornos comparten puerto a proposito: el proxy
    # inverso apunta siempre aqui y no hay que tocarlo al cambiar de uno a otro,
    # a cambio de que solo pueda correr uno de los dos a la vez.
    ports:
      - "6231:6231"
    volumes:
      - "./data:/usr/src/app/data"
      - *clamav-socket
    env_file:
      - ".env"
    environment:
      # Sobrescriben lo que venga del .env.
      #
      # PORT: dentro de la imagen se escucha SIEMPRE en el 6231. El .env puede
      # llevar 6230, que es el puerto de la API en desarrollo (ahi el 6231 lo
      # ocupa Vite), y esa diferencia no debe filtrarse al contenedor.
      PORT: "6231"
      REDIS_URL: "redis://redis:6379"
      # El worker va en su propio contenedor: abre ficheros no confiables con un
      # parser de documentos, y una reindexacion no debe competir por CPU con
      # las peticiones. Con INDEXING_ENABLED=false ninguno de los dos hace nada.
      INDEXING_WORKER_EMBEDDED: "false"
    depends_on:
      clamav:
        # Solo con el perfil clamav activo. Con el ClamAV del host no hay
        # servicio que esperar: la API reintenta la conexion al arrancar
        # (CLAMAV_INIT_RETRIES) y no escucha hasta tener escaner.
        condition: "service_healthy"
        required: false
      redis:
        condition: "service_healthy"
    networks:
      - "default"
      - "db"

  # La misma imagen, otro rol. Arranca despues de la API porque es ella quien
  # aplica las migraciones.
  pergamo-worker:
    container_name: "pergamo-worker"
    restart: "always"
    build:
      context: ".."
      dockerfile: "Dockerfile"
    volumes:
      - "./data:/usr/src/app/data"
      # Tambien analiza: es quien atiende el reescaneo del corpus.
      - *clamav-socket
    env_file:
      - ".env"
    environment:
      PERGAMO_ROLE: "worker"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      pergamo:
        condition: "service_started"
      redis:
        condition: "service_healthy"
    networks:
      - "default"
      - "db"

volumes:
  clamav-data:

networks:
  db:
    external: true
