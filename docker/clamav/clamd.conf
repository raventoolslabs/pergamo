# Configuracion de clamd para Pergamo.
#
# El motivo de que este fichero exista: sin el, clamd corre con los limites por
# defecto del paquete, que NO estan alineados con MAX_FILE_SIZE. Cuando un
# fichero excede sus limites internos, ClamAV por defecto no lo senala: lo da
# por bueno. Eso abre un rango de tamanos de subida que se aprueba sin haber
# sido analizado por completo.
#
# REGLA: MaxFileSize, MaxScanSize y StreamMaxLength deben ser SIEMPRE mayores o
# iguales que MAX_FILE_SIZE del .env. Si subes MAX_FILE_SIZE, sube tambien estos
# tres valores. El test de EICAR cerca del limite (test/02-document.test.ts) es
# el que detecta la desalineacion.

LogTime yes
LogClean no
Foreground yes

# La aplicacion habla con clamd por TCP desde otro contenedor. El puerto no se
# publica al host en docker-compose.yml: solo es alcanzable desde la red interna.
TCPSocket 3310
TCPAddr 0.0.0.0

# TCPAddr fija la escucha a IPv4. Es deliberado, y tiene una consecuencia que
# conviene no olvidar: el script clamdcheck.sh que trae la imagen oficial
# comprueba `nc localhost 3310`, y dentro del contenedor 'localhost' resuelve
# primero a ::1, con lo que ese script da 'Unable to contact server' aunque
# clamd responda perfectamente. Por eso el healthcheck de docker-compose.yml
# pregunta a 127.0.0.1 en vez de usar clamdcheck.sh.

# El socket local NO lo usa la aplicacion, pero el entrypoint de la imagen
# oficial espera a que aparezca para dar clamd por arrancado. Sin esta linea se
# queda en «Socket for clamd not found yet» hasta agotar CLAMD_STARTUP_TIMEOUT
# (1800 s) y entonces sale con codigo 1: el contenedor se reinicia cada media
# hora aunque clamd este respondiendo perfectamente por TCP.
LocalSocket /run/clamav/clamd.sock

# Lo que no se pueda escanear se senala como sospechoso en lugar de aprobarse.
# Es la opcion que cierra el hueco descrito arriba.
AlertExceedsMax yes

# Limites alineados con MAX_FILE_SIZE=52428800 (50 MB), con margen.
# StreamMaxLength es el critico: Pergamo escanea por INSTREAM, no por ruta.
MaxFileSize 64M
MaxScanSize 256M
StreamMaxLength 64M

# Contencion de bombas de descompresion sin recortar por debajo de lo que un
# documento ofimatico legitimo necesita: un ODT o un PDF con adjuntos anida
# varios niveles de ZIP y decenas de entradas.
MaxRecursion 16
MaxFiles 10000
MaxScanTime 120000

# Deteccion de estructuras anomalas en documentos (PDF con /OpenAction, /Launch
# o ficheros embebidos). No sustituye a una firma, pero es la senal mas util
# sobre el vector que si cubre bien ClamAV: el payload ejecutable embebido.
AlertOLE2Macros yes
AlertPartitionIntersection yes

# Firmas ignoradas localmente. Es la via para neutralizar un falso positivo
# concreto sin desactivar el escaneo ni modificar el documento.
DatabaseDirectory /var/lib/clamav
