name: Create release on merge to main

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write # crear el tag y la release
  packages: write # publicar la imagen en GHCR

jobs:
  create-release:
    # El evento 'closed' tambien salta cuando la PR se cierra sin mergear.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # En un evento pull_request, github.sha apunta a un commit de merge
          # efimero que no forma parte de main. merge_commit_sha si es el commit
          # real que ha quedado en la rama, y es lo que se etiqueta y se empaqueta.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Historia y tags completos: hacen falta para comprobar si el tag ya
          # existe y para que --generate-notes produzca un changelog real.
          fetch-depth: 0

      - name: Get project version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        env:
          TAG: v${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::El tag $TAG ya existe: no se publica nada. Sube la version de package.json para generar una release nueva."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR no admite mayusculas en el nombre de la imagen, y el owner del
      # repositorio si puede tenerlas.
      - name: Get image name
        id: get_image
        if: steps.check_tag.outputs.exists == 'false'
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # gh release create crea el tag y la release en una sola llamada.
      - name: Create tag and release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.get_version.outputs.version }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes

      - name: Log in to GitHub Container Registry
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          # Sin context explicito, la action construiria desde el repositorio
          # remoto en vez de desde el arbol que acaba de hacer checkout.
          context: .
          push: true
          tags: |
            ${{ steps.get_image.outputs.name }}:${{ steps.get_version.outputs.version }}
            ${{ steps.get_image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write summary
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          IMAGE: ${{ steps.get_image.outputs.name }}
        run: |
          {
            echo "### Release v$VERSION publicada"
            echo ""
            echo "- Imagen: \`$IMAGE:$VERSION\`"
            echo "- Imagen: \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
