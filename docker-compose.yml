# Pila completa de Pergamo: base de datos, escaner antivirico y API.
#
# Antes este fichero declaraba un unico servicio: la API con ClamAV dentro del
# mismo contenedor y sin base de datos, asi que `docker compose up` no levantaba
# nada usable por si solo. Ahora cada pieza corre en su propio contenedor, con
# su volumen y su healthcheck, y la API no arranca hasta que las dos de las que
# depende estan sanas.

services:

  postgres:
    container_name: "pergamo-postgres"
    image: "postgres:16.10-alpine"
    restart: "always"
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "30s"

  clamav:
    container_name: "pergamo-clamav"
    # Version fijada: el motor y el formato de la base de firmas van
    # emparejados, y un salto de version no anunciado puede dejar a clamd sin
    # cargar las firmas. Antes se instalaba `apk add clamav` sin fijar nada.
    image: "clamav/clamav:1.4.3"
    restart: "always"
    volumes:
      # Las firmas persisten entre reinicios: sin esto, cada arranque vuelve a
      # descargar la base completa desde cero.
      - "clamav-data:/var/lib/clamav"
      - "./clamav/clamd.conf:/etc/clamav/clamd.conf:ro"
      - "./clamav/local.ign2:/var/lib/clamav/local.ign2:ro"
    # El puerto NO se publica al host: clamd no autentica, y solo la API
    # necesita alcanzarlo dentro de la red interna de compose.
    expose:
      - "3310"
    healthcheck:
      # PING/PONG por TCP: clamd no responde mientras carga las firmas, que es
      # justo la ventana que antes dejaba a la API devolviendo 500.
      #
      # Se pregunta a 127.0.0.1 y no se usa clamdcheck.sh, el script de la
      # imagen oficial, porque ese consulta `nc localhost 3310` y dentro del
      # contenedor 'localhost' resuelve primero a ::1: con TCPAddr fijado a IPv4
      # el script falla siempre y el servicio quedaria eternamente 'unhealthy'.
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: "30s"
      timeout: "20s"
      retries: 10
      # La primera carga de firmas tarda; hasta agotarlo, un fallo no cuenta
      # como reintento ni marca el servicio como no sano.
      start_period: "180s"

  pergamo:
    container_name: "pergamo"
    #image: "pergamo"
    restart: "always"
    build:
      context: .
      dockerfile: "Dockerfile"
    ports:
      - "3000:3000"
    volumes:
      - "./data:/usr/src/app/data"
    env_file:
      - ".env"
    environment:
      # Sobrescriben lo que venga del .env: dentro de la red de compose los
      # destinos son los nombres de servicio, no localhost.
      DB_HOST: "postgres"
      DB_PORT: "5432"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
    depends_on:
      postgres:
        condition: "service_healthy"
      clamav:
        # La API espera a que el escaner este sano. Con ENABLE_ANTIVIRUS
        # desactivado esta espera sigue aplicandose; si no quieres el escaner en
        # este despliegue, elimina el servicio y esta dependencia.
        condition: "service_healthy"

volumes:
  postgres-data:
  clamav-data:
